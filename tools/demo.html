<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>VPN Super 节点收割 Demo</title>
<style>
 body{background:#0d1117;color:#e6edf3;font-family:Consolas,monospace;margin:0;padding:24px}
 h1{color:#58a6ff;font-size:22px} .sub{color:#8b949e;font-size:12px;margin-bottom:18px}
 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
 .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px}
 .cc{font-size:20px;font-weight:bold;color:#f0883e} .n{font-size:12px;color:#8b949e}
 table{width:100%;border-collapse:collapse;font-size:12px}
 th,td{border:1px solid #30363d;padding:5px 8px;text-align:left}
 th{background:#161b22;color:#58a6ff;position:sticky;top:0}
 tr:hover{background:#161b22} .vip{color:#db61a2} .load{color:#3fb950}
 input{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 10px;width:220px}
</style>
</head>
<body>
<h1>🔓 VPN Super Unlimited Proxy — 节点收割 Demo</h1>
<div class="sub">server_list AES-256-CBC 已破 (key: 01fb…373e) · prod-api.mobilejump.mobi · <span id="gen"></span></div>
<input id="q" placeholder="过滤国家/IP/服务…" oninput="render()">
<div class="cards" id="cards"></div>
<table><thead><tr><th>Host</th><th>国家</th><th>城市</th><th>负载</th><th>服务</th></tr></thead><tbody id="tb"></tbody></table>
<script>
let DATA=[],STATS=null;
async function load(){
 const s=await (await fetch('/api/stats')).json(); STATS=s;
 document.getElementById('gen').textContent='生成时间 '+new Date(s.generation_ts*1000).toLocaleString();
 document.getElementById('cards').innerHTML=s.countries.slice(0,12).map(([c,n])=>
  `<div class="card"><div class="cc">${c}</div><div class="n">${n} 台</div></div>`).join('');
 const r=await (await fetch('/api/servers')).json(); DATA=r.servers; render();
}
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const rows=DATA.filter(s=>!q||JSON.stringify(s).toLowerCase().includes(q)).slice(0,300);
 document.getElementById('tb').innerHTML=rows.map(s=>
  `<tr><td>${s.host}</td><td class="${s.vip?'vip':''}">${s.country}${s.vip?' VIP':''}</td><td>${s.city||''}</td>
   <td class="load">${s.load}</td><td>${s.services.map(x=>x.id+':'+x.ports.join('/')).join('<br>')}</td></tr>`).join('');
}
load();
</script>
</body>
</html>
